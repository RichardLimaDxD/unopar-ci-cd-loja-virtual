# =============================================================================
# Pipeline de CI/CD da Loja Virtual UNOPAR (GitLab CI/CD)
# -----------------------------------------------------------------------------
# O GitLab lê este arquivo (.gitlab-ci.yml) na raiz do repositório a cada push
# e cria um PIPELINE: um conjunto de JOBS organizados em STAGES (estágios).
# Equivalente ao workflow do GitHub Actions em .github/workflows/ci.yml.
# =============================================================================

# STAGES: definem a ORDEM de execução. Jobs do mesmo estágio rodam em paralelo;
# o próximo estágio só começa se TODOS os jobs do estágio anterior passarem.
stages:
  - build
  - test
  - docker
  - deploy

# VARIABLES: variáveis de ambiente disponíveis para todos os jobs.
# $DOCKERHUB_USER e $DOCKERHUB_TOKEN NÃO ficam no código: são cadastradas em
# Settings > CI/CD > Variables (marcadas como "Masked" e "Protected").
# $CI_COMMIT_SHORT_SHA, $CI_COMMIT_BRANCH e $CI_DEFAULT_BRANCH são variáveis
# predefinidas pelo próprio GitLab.
variables:
  NOME_IMAGEM: "$DOCKERHUB_USER/loja-virtual-unopar"

# DEFAULT: configurações herdadas por todos os jobs (podem ser sobrescritas).
default:
  # IMAGE: imagem Docker usada como ambiente de execução do job (o runner
  # cria um container a partir dela e executa o "script" dentro dele).
  image: node:20

  # CACHE: reaproveita arquivos entre execuções do pipeline para acelerar os
  # jobs. A chave muda quando o package-lock.json muda (dependências novas).
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

# -----------------------------------------------------------------------------
# JOB "build" - estágio build
# JOB é a unidade de trabalho do pipeline; SCRIPT é a lista de comandos shell
# executados em sequência. Se um comando falhar (código != 0), o job falha.
# -----------------------------------------------------------------------------
build:
  stage: build
  script:
    - npm ci
    - npm run lint
    - for arquivo in src/*.js; do node --check "$arquivo"; done
    - echo "Build e lint concluídos"

# -----------------------------------------------------------------------------
# JOB "test" - estágio test
# Executa os testes unitários e de integração. Se algum teste falhar, o job
# falha e os estágios seguintes (docker e deploy) NÃO são executados.
# -----------------------------------------------------------------------------
test:
  stage: test
  script:
    - npm ci
    - mkdir -p reports
    - set -o pipefail
    - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit.xml test/*.test.js 2>&1 | tee reports/resultado-testes.txt
  # ARTIFACTS: arquivos gerados pelo job que ficam salvos no GitLab para
  # download e consulta. "when: always" guarda os relatórios mesmo se os
  # testes falharem; "reports: junit" exibe os testes na aba "Tests" do pipeline.
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expire_in: 1 week

# -----------------------------------------------------------------------------
# JOB "docker" - estágio docker
# Constrói a imagem da aplicação, faz um smoke test e publica no Docker Hub.
# -----------------------------------------------------------------------------
docker:
  stage: docker
  # Este job usa a imagem oficial do Docker (cliente docker), e não a node:20.
  image: docker:24
  # SERVICES: containers auxiliares que rodam junto com o job. O serviço
  # docker:24-dind ("Docker in Docker") fornece o daemon Docker que executa
  # os comandos "docker build", "docker run" e "docker push".
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # Este job não precisa do cache de node_modules
  cache: []
  script:
    - docker build --label "org.opencontainers.image.source=$CI_PROJECT_URL" -t "$NOME_IMAGEM:$CI_COMMIT_SHORT_SHA" -t "$NOME_IMAGEM:latest" .
    # Smoke test: sobe o container e consulta /api/health (o daemon roda no host "docker")
    - docker run -d --name loja-smoke -p 3000:3000 "$NOME_IMAGEM:$CI_COMMIT_SHORT_SHA"
    - for i in $(seq 1 15); do wget -qO- http://docker:3000/api/health && break; echo "Aguardando a aplicação..."; sleep 2; done
    - wget -qO- http://docker:3000/api/health | grep '"status":"ok"'
    - docker rm -f loja-smoke
    # Publicação no Docker Hub (somente na branch padrão, ex.: main)
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
        docker push "$NOME_IMAGEM:$CI_COMMIT_SHORT_SHA"
        docker push "$NOME_IMAGEM:latest"
      else
        echo "Branch $CI_COMMIT_BRANCH: imagem construída e testada, mas não publicada."
      fi

# -----------------------------------------------------------------------------
# JOB "deploy" - estágio deploy
# Implantação (simulada) em produção.
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.20
  cache: []
  # ENVIRONMENT: registra a implantação no ambiente "production"
  # (Operate > Environments), mantendo o histórico de versões implantadas.
  environment:
    name: production
  # RULES: condições para o job entrar no pipeline. Aqui o deploy só acontece
  # em commits na branch padrão (main); em outras branches o job é ignorado.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - VERSAO=$(grep '"version"' package.json | head -n 1 | cut -d '"' -f 4)
    - echo "Iniciando deploy da versão $VERSAO (commit $CI_COMMIT_SHORT_SHA)"
    - echo "1/3 - Baixando a imagem $NOME_IMAGEM:$CI_COMMIT_SHORT_SHA"
    - echo "2/3 - Atualizando o serviço loja-virtual em produção"
    - echo "3/3 - Verificando a saúde em /api/health"
    - echo "Deploy em produção (simulado) da versão $VERSAO - commit $CI_COMMIT_SHORT_SHA"
